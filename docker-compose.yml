services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ozon
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon -d ozon"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ENV: ${APP_ENV:?Set APP_ENV explicitly in .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deployment/Caddy.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
