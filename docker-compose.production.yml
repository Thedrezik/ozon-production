# Standalone production file. Never combine with the development Compose file.
name: ozon-production
services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 256m
    memswap_limit: 320m
    cpus: 0.75
    pids_limit: 100
    shm_size: 64m
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=256MB", "-c", "max_parallel_workers_per_gather=0", "-c", "max_parallel_workers=0"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE release tag}
    build: ./backend
    mem_limit: 384m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 100
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      OZON_MOCK_MODE: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      APP_PUBLIC_URL: https://${DOMAIN:?Set DOMAIN}
      OZON_WEBHOOK_TRUSTED_PROXIES: ${CADDY_PROXY_IP:?Set exact Caddy IP}/32
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    networks: [proxy, database]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health/ready', headers={'Host': os.environ['DOMAIN']}), timeout=4)"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging
    stop_grace_period: 40s
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:?Set immutable CADDY_IMAGE release tag}
    build: {context: ., dockerfile: deployment/Caddy.Dockerfile}
    mem_limit: 96m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 100
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      GOMEMLIMIT: 64MiB
    ports: ["80:80", "443:443"]
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:?Set exact Caddy IP}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
    logging: *logging
    restart: unless-stopped

networks:
  proxy:
    ipam:
      config: [{subnet: "${PROXY_SUBNET:?Choose a subnet that does not overlap existing routes}"}]
  database:
    internal: true
    ipam:
      config: [{subnet: "${DATABASE_SUBNET:?Choose a second non-overlapping subnet}"}]
volumes:
  postgres_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
